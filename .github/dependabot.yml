version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/plugins/gatsby-remark-post-wikilinks"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm_plugins_gatsby-remark-post-wikilinks:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github_actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
